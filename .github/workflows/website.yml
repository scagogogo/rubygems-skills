name: Deploy Website

# Build the VitePress site and deploy it to GitHub Pages.
# Docs: https://vitepress.dev/guide/deploy#github-pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, skip queued builds.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build with VitePress
        working-directory: website
        run: npm run build

      - name: Check for dead links in built HTML output
        working-directory: website
        run: |
          cargo install lychee --locked
          lychee \
            --exclude-file .lycheeignore \
            --timeout 30 --max-redirects 10 --max-concurrency 16 \
            --no-progress --accept 200,301,302,308,999 \
            --format compact \
            '.vitepress/dist/**/*.html' \
            '../README.md' '../README.zh-CN.md'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
