<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="rubygems-skills logo">
  <defs>
    <linearGradient id="gemFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5484d"/>
      <stop offset="100%" stop-color="#a51d22"/>
    </linearGradient>
    <linearGradient id="gemLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cc342d"/>
      <stop offset="100%" stop-color="#7c1a16"/>
    </linearGradient>
    <linearGradient id="gemRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9434b"/>
      <stop offset="100%" stop-color="#8a1f1c"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f06168"/>
      <stop offset="100%" stop-color="#cc342d"/>
    </linearGradient>
  </defs>

  <!-- gem body: a cut ruby seen from the front -->
  <g transform="translate(100 100)">
    <!-- top crown facets -->
    <polygon points="-70,-30 0,-80 70,-30 35,-10 -35,-10" fill="url(#gemTop)"/>
    <polygon points="-70,-30 -35,-10 -55,30" fill="url(#gemLeft)"/>
    <polygon points="70,-30 35,-10 55,30" fill="url(#gemRight)"/>
    <!-- pavilion (bottom point) -->
    <polygon points="-35,-10 35,-10 55,30 0,80 -55,30" fill="url(#gemFace)"/>
    <polygon points="-35,-10 -55,30 0,80" fill="url(#gemLeft)" opacity="0.85"/>
    <polygon points="35,-10 55,30 0,80" fill="url(#gemRight)" opacity="0.85"/>
    <!-- table highlight -->
    <polygon points="-25,-25 0,-65 25,-25 0,-5" fill="#ffffff" opacity="0.18"/>
    <!-- sparkle -->
    <circle cx="-30" cy="-45" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="22" cy="-50" r="2" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
